# fail2ban filter — kelixip: scanners
#
# A credential for a user this node does not know, a credential minted for another
# realm, or a request for a domain this node does not serve. Nobody mistypes a
# username or a domain several times; a scanner does little else. Format and
# contract: see kelixip-auth.conf.

[Definition]

failregex = ^.*kelixip: auth-failure src=<HOST> port=\d+ proto=\S+ method=\S+(?: realm=\S+)?(?: user="(?:[^"\\]|\\.)*")? reason=(?:unknown_user|bad_realm)\s*$
            ^.*kelixip: invalid-domain src=<HOST> port=\d+ proto=\S+(?: method=\S+)? reason=(?:unknown_domain|no_domain)\s*$

ignoreregex =
