# fail2ban filter — kelixip: the REST control API
#
# A request to the control API with a missing or wrong bearer token, or without
# the client certificate mTLS requires. The line carries the HTTP verb and never
# the path. Format and contract: see kelixip-auth.conf.

[Definition]

failregex = ^.*kelixip: api-auth src=<HOST> port=\d+ proto=\S+ method=\S+ reason=(?:missing_token|invalid_token|no_client_cert)\s*$

ignoreregex =
