# fail2ban filter — kelixip: wrong passwords
#
# One line per refused credential, written by kelixip's incident reporter both to
# the journal and to /var/log/kelixip/security.log. The `kelixip: ` prefix and the
# key order are a contract, pinned by apps/kelixip/test/fail2ban_filter_test.exs.
# `user` is the only free text on the line: it is quoted and escaped, so it can
# not forge a second `src=`.
#
# Counted here: bad_password only. An unknown user or a foreign realm is a
# scanner, not a mistyped password — see kelixip-scan.conf.

[Definition]

failregex = ^.*kelixip: auth-failure src=<HOST> port=\d+ proto=\S+ method=\S+(?: realm=\S+)?(?: user="(?:[^"\\]|\\.)*")? reason=bad_password\s*$

ignoreregex =
