# fail2ban filter — kelixip: traffic that is not SIP
#
# A datagram or a stream the SIP parser refuses, a message past the size bound,
# a TLS handshake that fails, a WebSocket upgrade that fails. A keep-alive and a
# STUN binding are never counted: kelixip tells them apart before the parser.
#
# A UA whose messages trip a parser case kelixip does not foresee would be
# counted here. The node-side switch is `[security] ignore = ["invalid-packet"]`
# in config.toml; the other filters keep working. Format and contract: see
# kelixip-auth.conf.

[Definition]

failregex = ^.*kelixip: invalid-packet src=<HOST> port=\d+ proto=\S+ reason=(?:unparsable|too_large|bad_frame|garbage)\s*$
            ^.*kelixip: transport-error src=<HOST> port=\d+ proto=\S+ reason=(?:tls_handshake|ws_upgrade)\s*$

ignoreregex =
