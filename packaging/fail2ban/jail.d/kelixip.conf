# fail2ban jails for a kelixip node — an EXAMPLE to copy into /etc/fail2ban/jail.d/
#
# The filters live in /usr/share/kelixip/fail2ban/filter.d/; copy or symlink them
# into /etc/fail2ban/filter.d/ first:
#
#   ln -s /usr/share/kelixip/fail2ban/filter.d/kelixip-*.conf /etc/fail2ban/filter.d/
#   cp /usr/share/kelixip/fail2ban/jail.d/kelixip.conf /etc/fail2ban/jail.d/
#   fail2ban-client reload
#
# Two sources carry the same lines; pick ONE per jail and delete the other:
#
#   - the dedicated file, written when config.toml has
#     [security] log_file = "/var/log/kelixip/security.log" (the packaged default):
#         logpath = /var/log/kelixip/security.log
#   - the journal, always written:
#         backend      = systemd
#         journalmatch = _SYSTEMD_UNIT=kelixip.service
#
# Read before enabling:
#
#   - UDP source addresses are spoofable. Whoever forges a customer's address can
#     get it banned. Put the addresses of your own peers and trunks in `ignoreip`.
#   - Over IPv6, ban a /64, not a single address: one host has more addresses
#     than maxretry will ever see. fail2ban bans the exact address by default;
#     give the jails a banaction that applies a /64 (see your fail2ban version's
#     action.d) or add the offending /64 to your firewall by hand.
#   - A NATed office is one address. Keep `maxretry` generous on kelixip-auth
#     (a colleague mistyping a password) and strict on kelixip-scan (a scanner).
#   - Do NOT enable these jails on a node behind a reverse proxy or a load
#     balancer that terminates the connection: every source the node sees is the
#     proxy's own address, and the first ban cuts off every user at once.

[DEFAULT]
ignoreip = 127.0.0.1/8 ::1
findtime = 600
bantime  = 3600

# Five wrong passwords in ten minutes.
[kelixip-auth]
enabled  = true
filter   = kelixip-auth
logpath  = /var/log/kelixip/security.log
maxretry = 5

# An unknown user, a foreign realm or an unknown domain: twice is enough.
[kelixip-scan]
enabled  = true
filter   = kelixip-scan
logpath  = /var/log/kelixip/security.log
maxretry = 2

# The control API answers nobody without a credential.
[kelixip-api]
enabled  = true
filter   = kelixip-api
logpath  = /var/log/kelixip/security.log
maxretry = 3

# Non-SIP traffic and failed handshakes. Generous: a misbehaving UA sends some.
[kelixip-packet]
enabled  = true
filter   = kelixip-packet
logpath  = /var/log/kelixip/security.log
maxretry = 20
