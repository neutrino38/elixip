# /etc/kelixip/domains.toml — the served domains and their dial-plan.
#
# Hot-reloadable: `kelictl domain reload-all` (or `systemctl reload kelixip`) applies
# it atomically — one bad value and the whole reload is rejected, the running
# config untouched. Every key is documented in
# /usr/share/doc/kelixip/installation.md.
#
# Shipped EMPTY on purpose: a fresh install serves no domain, so it answers 404
# to everything until you declare what it is responsible for. Nothing here is a
# default you inherit by accident.
#
# A request is routed by its R-URI host (falling back to the To host); no match is
# a 404. The method then selects the function — REGISTER -> registrar,
# INVITE -> calls, SUBSCRIBE/PUBLISH -> presence, MESSAGE -> chat — and a function
# with no block on
# that domain is a 405. For presence there is one more step: the request's `Event`
# header selects which [[domain.presence]] block serves it, and a package this
# domain declares none for is answered 489 before any script runs.

#[[domain]]
#name    = "example.com"
#aliases = ["sip.example.com", "203.0.113.10"]     # also routed here; realm stays `name`
#                                                  # `*.example.com` routes every host below
#                                                  # that suffix, at any depth
#max_calls = 200                                   # per-domain cap, 503 beyond it
#
#  # Presence of the block enables the function. The script is resolved under
#  # server.script_dir and is refused at load time if a module it declares in
#  # `config uses_modules:` is not loaded — so install kelixip-mod-registrar and
#  # kelixip-mod-auth_db before pointing a domain at registrar.exs.
#  [domain.registrar]
#  script = "registrar.exs"               # or "registrar-presence.exs": the same, and
#                                         # a subscriber that does not PUBLISH is open
#                                         # while registered (kelixip-mod-presence);
#                                         # or "registrar-chat.exs": that, plus the
#                                         # delivery of stored messages (kelixip-mod-silo)
#  #default_expires = 3600       # per-domain override of [module.registrar]
#  #min_expires     = 60
#
#  # Presence: ONE block per event package the domain serves, and the package is
#  # the key. `subscribe` is required; a package with no `publish` script answers
#  # 405 to a PUBLISH. Both scripts need kelixip-mod-presence installed.
#  [[domain.presence]]
#  event-package = "presence"
#  subscribe     = "presence-subscribe.exs"
#  publish       = "presence-publish.exs"
#
#  # Chat (page-mode MESSAGE, RFC 3428): the dial-plan's shape, on the R-URI
#  # user-part. One instance serves a conversation — same sender, same recipient,
#  # same connection — until it is silent `idle_timeout` seconds. p2p-chat.exs
#  # authenticates the sender, relays to every device of the recipient and
#  # stores what nobody took: kelixip-mod-silo, with registrar-chat.exs above.
#  [[domain.chat]]
#  default      = true
#  script       = "p2p-chat.exs"
#  idle_timeout = 300
#
# A buddy list (RFC 4662) is a SUBSCRIBE to a LIST URI, and clients hard-code
# which one: Linphone sends `sip:rls@sip.linphone.org` whatever the account's own
# domain is. So the list server is declared as a domain of its own, named after
# the URI the client sends, and serving nothing but presence. Its script is
# `presence-rls.exs`, which authenticates the watcher on the realm of its own
# From and answers with the state of every buddy this node serves.
#
#[[domain]]
#name = "sip.linphone.org"
#
#  [[domain.presence]]
#  event-package = "presence"
#  subscribe     = "presence-rls.exs"
#
#  # The dial-plan: ordered, first match wins on the R-URI user-part. Asterisk-style
#  # patterns (X=0-9, Z=1-9, N=2-9, [13-6], . = 1+, ! = 0+). The catch-all is last.
#  [[domain.call]]
#  pattern = "0[1-9]XXXXXXXX"
#  script  = "national.exs"
#
#  [[domain.call]]
#  default = true
#  script  = "default_call.exs"

# The usrloc store's own block. It lives HERE, not in config.toml, so it is
# reloadable alongside the domains it serves — a stray copy in config.toml is
# ignored. Uncommenting it loads the registrar module (kelixip-mod-registrar).
#[module.registrar]
#max_contacts_per_aor = 10
#min_expires          = 60
#default_expires      = 3600

# [module.presence] lives in config.toml, not here: only `registrar` is read from
# this file, and any other [module.*] block written here is ignored.
