# /etc/kelixip/config.toml — infrastructure configuration (restart-only).
#
# Every key is documented in /usr/share/doc/kelixip/installation.md. The served
# domains and the dial-plan are NOT here: they live in domains.toml, which is
# hot-reloadable (`kelictl domain reload-all` / `systemctl reload kelixip`).
#
# This file is validated at every boot. Any error — a bad value, an unknown key,
# a port that cannot be bound — aborts the start with the reason on stderr, rather
# than running half-configured.

[server]
# Must match RELEASE_NODE in /etc/sysconfig/kelixip: this is the name kelictl
# resolves the node by.
node_name  = "kelixip@127.0.0.1"
script_dir = "/usr/share/kelixip"
module_dir = "/usr/lib/kelixip/modules"
# user_agent = "Kelixip/1.4.0"
# max_calls  = 1000          # node-wide concurrent-instance cap; 503 beyond it

[log]
# "syslog" ADDS an RFC 3164 sink over /dev/log; stdout stays live either way,
# because systemd captures it and a startup failure has to be visible there.
target = "stdout"
level  = "info"
# facility = "local0"

# One [[listen]] block per inbound socket. UDP is one socket per node: extra udp
# entries are ignored with a warning. tls/wss require `cert` + `key`.
[[listen]]
proto = "udp"
addr  = "0.0.0.0"
port  = 5060

#[[listen]]
#proto = "tcp"
#port  = 5060

#[[listen]]
#proto = "wss"
#port  = 8443
#cert  = "/etc/kelixip/tls/fullchain.pem"
#key   = "/etc/kelixip/tls/privkey.pem"

# Prometheus /metrics + /health. No auth — keep it on loopback and let a local
# Prometheus scrape it. Remove the block to disable it entirely.
[metrics]
addr = "127.0.0.1"
port = 9095

# The REST admin frontal. Disabled by default: enabling it means choosing a token,
# and a token shipped in a package would be no secret at all. Uncomment, set your
# own, and keep the listener on loopback unless you switch to auth = "mtls".
#[control_api]
#addr  = "127.0.0.1"
#port  = 8090
#auth  = "token"
#token = "CHANGE-ME"

# Loadable modules — one block per module to load, from module_dir. Nothing is
# loaded by default: install the matching kelixip-mod-* package first, or the
# block is logged and skipped.
#
# [module.registrar] lives in domains.toml, not here (it is hot-reloadable).

#[module.auth_db]                  # dnf install kelixip-mod-auth_db
#host          = "127.0.0.1"
#port          = 3306
#database      = "kamailio"
#username      = "kamailio"
#password      = "secret"
#table         = "subscriber"
#ha1_column    = "ha1"             # ha1 = H(user:realm:pw) | ha1b = H(user@domain:realm:pw)
#password_hash = "md5"             # md5 | sha256 — authoritative, both ways
#pool_size     = 4                 # 1 serialises every REGISTER
# TLS to the base is tried FIRST, with no key to set for it. Add the CA to get the
# server actually verified; without it the link is encrypted but unauthenticated.
#ssl_ca_cert_file = "/etc/pki/tls/certs/db-ca.pem"
# A base that speaks NO TLS needs this, or every authentication answers 500. Check
# with `kelictl auth_db show`, which prints the transport it settled on.
#allow_insecure_db_connection = true

#[module.mcu]                      # dnf install kelixip-mod-mcu
# Conferencing. Needs a [mediaserver.pool.*] entry below pointing at a reachable
# mediaserver, and a domains.toml call rule sending the DID pattern to mcu.exs —
# the module allocates DIDs, it never edits the dial plan. Every key is optional;
# these are the defaults, except the three paths, which have none.
#did_range        = "8000-8099"     # pool for a create that omits `did`; per-domain
                                   #   override: did_ranges = { "example.com" = "8100-8199" }
#max_participants = 20              # reached => the next caller gets 486
#destroy_when_empty = false         # destroy a conference with its last participant
#vad              = "basic"         # none | basic | full — names, not wire integers
#rate             = 32000           # mixer rate; participants are resampled to it
# No codec list: the offer is the menu and the media server arbitrates (P8a). What is
# left is the deployment policy — which medias a conference answers, and whether DTMF
# is proposed at all. `audio_codecs` / `video_codecs` / `text_codecs` / `video_fmtp`
# are still accepted for one release, ignored with a warning naming the replacement.
#medias           = ["audio", "video", "text"]
                                   #   an omitted media is answered with port 0: this
                                   #   is how video or T.140 text is turned off
#dtmf             = true            # propose telephone-event (RFC 4733) on audio —
                                   #   a stream the mixer never encodes, so a switch
                                   #   and not a codec
#auto_layout      = true            # the mosaic follows the number of video legs
#layout_comp      = "2x2"           # starting mosaic when auto_layout is off
#video_size       = "hd720p"
#video_fps        = 30
#video_bitrate    = 1500            # kbps, also the cap on the answer's b=AS:; defaults
                                   #   to [mediaserver] video_bitrate above
#video_intra_period = 300           # frames between intra-frames
                                   #   (the H.264 profile the answer states is the one
                                   #   the media server reported it accepted, so there
                                   #   is no fmtp key to set here)
# Paths on the MEDIA SERVER's filesystem, not on this host (the same box in a
# single-machine deployment, and not in production). The module only ever appends a
# file name it validated; a command chooses the name, never the directory. Unset
# record_dir means recording.start refuses.
#record_dir       = "/var/lib/mediaserver/rec"
#image_dir        = "/var/lib/mediaserver/img"
#logo_file        = "logo.png"      # drawn in every EMPTY mosaic slot, every conference
#xmlrpc_timeout_ms = 10000          # per-RPC bound towards the media server
#call_timeout_ms  = 5000            # upper bound on a facade call
#shutdown_grace_ms = 5000           # grace given to live conferences at module stop
#rtp_timeout_ms   = 10000           # RTP inactivity watchdog (needs media server support)
#gc_orphans       = true            # sweep, at start, conferences no kelixip owns
# The collaboration channel between the participants' SCRIPTS (a raised hand, a floor
# token — not chat: text a human reads in the call is T.140, which the mixer handles).
# CLOSED until you list the kinds it accepts, and a script must also declare that it
# handles messages before any reaches it.
#message_kinds    = ["hand.raised", "hand.lowered", "floor.request", "floor.grant"]
#message_rate     = 5               # messages per second and per participant
#message_max_bytes = 1024           # longer payloads are refused, never truncated
#message_queue_max = 100            # skip a leg whose script is that far behind
# /usr/share/doc/kelixip-mod-mcu/ has the whole block key by key (mcu.md), the
# control surface and what to look at when a call does not join (mcu_module_guide.md).

# The media servers, declared here and nowhere else: point-to-point calls take one
# per call (round-robin + health-check), and the mcu module opens one control channel
# per `mendooze` entry. Not needed for a registrar-only node.
#
# No media address here: what the server announces in the SDP is its own setting
# (`mediaserver --public-ip`, mandatory behind a NAT) and it reports it per call.

#[mediaserver]
# The node's video bitrate, in kbps: what a video leg is encoded at, and the cap on
# the `b=AS:` this node answers with (the offered value wins when it is lower). One
# value for both media paths — point-to-point calls and conferences — which is why it
# is here and not per pool entry. `[module.mcu] video_bitrate` overrides it for
# conferences only.
#video_bitrate = 1500

# Negotiate transport-wide congestion control on video (RFC 8285 `a=extmap` +
# `a=rtcp-fb transport-cc`). It is what lets the media server measure what the network
# really absorbs towards each peer and drive its encoder from that, instead of only
# from what the peer asks for. Off by default: the server does not yet report arrivals
# for the streams it RECEIVES, so a peer that negotiates the extension gets nothing
# back for its own outgoing stream and keeps using our REMB/TMMBR — no worse than
# today, but unmeasured. One value for both media paths.
#transport_cc = false

#[mediaserver.pool.mcu1]
#module = "mendooze"
#url    = "http://mcu1.example.com:8080"
#enabled = true                    # kelictl can toggle it without a restart
