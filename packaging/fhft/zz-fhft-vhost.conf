# The store's own name, under the *.weshwesh.eu wildcard (chat-media-plan S0).
# "zz-": loaded after php.conf, so fhft.inc's SetHandler none on the upload
# directory wins over php.conf's handler.
<VirtualHost *:443>
    ServerName files.weshwesh.eu
    # The URL in the XML is built from these two: the canonical name and port
    UseCanonicalName On
    SSLEngine on
    SSLCertificateFile      /etc/pki/tls/certs/@WILDCARD@.crt
    SSLCertificateKeyFile   /etc/pki/tls/private/@WILDCARD@.key

    # Own logs, to read this vhost alone. The access log holds the URLs of the
    # files downloaded, which are their capability (design §6.6): keep it for
    # debugging, with a short rotation, or log the uploads only.
    #ErrorLog  logs/files-weshwesh-error_log
    #CustomLog logs/files-weshwesh-access_log combined

    # Just above fhft_maximum_file_size_in_MB (64 MB)
    LimitRequestBody 68157440
    Include /etc/httpd/conf.d/fhft.inc
</VirtualHost>
