# The rehearsal's vhost: plain HTTP on the port compose publishes. The URL in
# the XML is built from the canonical name and port, so they are the host's.
<VirtualHost *:80>
    ServerName localhost:8089
    UseCanonicalName On
    LimitRequestBody 68157440
    Include /etc/httpd/conf.d/fhft.inc
</VirtualHost>
